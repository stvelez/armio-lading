name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Escaneo del árbol de trabajo (no sigue .gitignore, por eso la
      # allowlist de .gitleaks.toml excluye node_modules/ y .next/).
      - name: Escanear árbol de trabajo
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # Escaneo solo del rango del push/PR: la historia completa tiene blobs
      # grandes y no es necesario recorrerla en cada ejecución.
      - name: Escanear rango de commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "${BASE_REF:-}" ]; then
              echo "Sin base_ref; se omite el escaneo de rango."
              exit 0
            fi
            # Sin --depth: el checkout ya es completo (fetch-depth: 0) y un
            # fetch superficial rompería el rango BASE..SHA.
            git fetch --no-tags origin "$BASE_REF"
            BASE="origin/${BASE_REF}"
          else
            BASE="${BEFORE_SHA:-}"
          fi

          # Omitir si la base está vacía o es todo ceros (rama nueva / tag).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Sin commit base válido; se omite el escaneo de rango."
            exit 0
          fi

          echo "Escaneando rango ${BASE}..${HEAD_SHA}"
          gitleaks git . --log-opts="${BASE}..${HEAD_SHA}" --config .gitleaks.toml --redact --no-banner

name: SAST

# Análisis estático con Semgrep Community Edition (sin token ni panel externo).
# Escanea cambios en PRs, la rama principal y una vez por semana.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '20 7 * * 1'

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Escanear
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          semgrep scan
          --config p/security-audit
          --config p/owasp-top-ten
          --config p/typescript
          --config p/javascript
          --severity ERROR
          --error
          .

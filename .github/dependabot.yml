version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Bogota"
    # Solo limita los PRs de version updates. Dependabot NO aplica este límite a
    # los security updates: esos llegan como PRs individuales (uno por advisory)
    # y hay que revisarlos aparte.
    open-pull-requests-limit: 5
    # Espera 7 días antes de proponer una versión recién publicada.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Un solo PR para todos los parches de version updates. Los security
      # updates quedan fuera del grupo a propósito, para poder mergear cada
      # corrección de forma independiente.
      parches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"

  # Mantiene actualizados los SHA de las actions fijadas en los workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
